{% extends "base.html" %}

{% block title %}
Modifier un actif
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning">

                    <h3>

                        <i class="bi bi-pencil-square"></i>

                        Modifier un actif

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="text-end mt-4">

                            <a href="{% url 'assets:assets_list' %}"
                               class="btn btn-secondary">

                                Retour

                            </a>

                            <button
                                class="btn btn-warning"
                                type="submit">

                                Mettre à jour

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
