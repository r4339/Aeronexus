{% extends "base.html" %}

{% block title %}Nouvelle demande{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>

Nouvelle demande d'accès

</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<div class="text-end">

<a href="{% url 'access:requests_list' %}"
class="btn btn-secondary">

Annuler

</a>

<button
type="submit"
class="btn btn-primary">

Créer

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
