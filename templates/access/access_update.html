{% extends "base.html" %}

{% block title %}
Modifier une demande
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning">

                    <h3>

                        <i class="bi bi-pencil-square"></i>

                        Modifier une demande d'accès

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="text-end">

                            <a
                            href="{% url 'access:requests_list' %}"
                            class="btn btn-secondary">

                                Retour

                            </a>

                            <button
                            type="submit"
                            class="btn btn-warning">

                                Mettre à jour

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
