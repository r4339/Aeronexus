services:
  web:
    build: .
    container_name: aeronexus-web

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

    env_file:
      - .env.prod

    ports:
      - "8000:8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    

    restart: unless-stopped
  
    healthcheck:
      test:
       [
         "CMD",
         "python",
         "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  

  nginx:
    image: nginx:latest
    container_name: aeronexus-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      - web

    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: